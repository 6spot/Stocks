services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocks
      POSTGRES_DB: stocks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocks -d stocks"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [internal]

  api:
    build:
      context: ./backend
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    env_file: .env
    environment:
      CLASSIFICATION_API_BASE_URL: ${CLASSIFICATION_API_BASE_URL-}
      CLASSIFICATION_API_KEY: ${CLASSIFICATION_API_KEY-}
      CLASSIFICATION_MODEL_NAME: ${CLASSIFICATION_MODEL_NAME-}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "stocks.api:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ./backend
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    env_file: .env
    environment:
      CLASSIFICATION_API_BASE_URL: ${CLASSIFICATION_API_BASE_URL-}
      CLASSIFICATION_API_KEY: ${CLASSIFICATION_API_KEY-}
      CLASSIFICATION_MODEL_NAME: ${CLASSIFICATION_MODEL_NAME-}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "stocks.worker"]
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    platform: ${TARGET_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:-stocks-pgdata}

networks:
  internal:
