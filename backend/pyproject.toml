[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "stocks-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2", "boto3>=1.35,<2", "fastapi>=0.115,<1",
  "feedparser>=6,<7", "httpx>=0.27,<1", "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7", "SQLAlchemy>=2.0,<3", "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/stocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
