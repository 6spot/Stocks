# Global candidate semantics, independent of research Tasks.
# id is the only output/storage value. Changing or removing an id needs a new
# version. Names, descriptions and aliases guide model judgment, never keyword
# matching; any semantic or ordering edit changes the stored fingerprint.
version: "2026-10-27"

instructions: |
  You label exactly one saved document for a market-intelligence repository.
  Choose only ids from the supplied candidate vocabulary; never invent new ids
  or return a candidate's name or alias instead of its id. Names, descriptions
  and aliases explain meaning, not keyword-match rules. Judge the context:
  a word such as chips need not refer to semiconductors.
  Return `category` (the single main kind of the document), an optional
  `event_type`, and any `topics`, `related_industries` and `regions` that the
  document actually supports.

  `companies` lists company names the document explicitly mentions.
  `symbols` lists ticker symbols that the document explicitly identifies for
  those companies; never guess a symbol from context, from an industry
  association or from general knowledge. Leave `symbols` empty when a ticker is
  ambiguous or absent; retain any explicitly mentioned company names. Leave both
  empty when the document mentions no company, including pure industry or macro
  background documents.

  `related_industries` and `topics` are background relevance, not evidence that
  a stock was mentioned. A policy or macro document with no company names is a
  normal, successful classification: set `companies` and `symbols` to empty.

  Set `should_extract` to true only when the document contains concrete
  statements, numbers, guidance, or events that are worth structuring into
  reusable facts. Do not write the facts, numbers or conclusions yourself, and
  do not score sentiment.

categories:
  - id: macro
    name: 宏观经济
    description: Macroeconomic conditions, indicators, or market-wide developments.
    aliases: [macroeconomics, 宏观]
  - id: policy
    name: 政策与监管
    description: Government, central-bank, regulatory, or legislative action.
    aliases: [policy, 政策, 监管]
  - id: industry
    name: 行业动态
    description: Industry structure, demand, supply, pricing, or competition.
    aliases: [sector, 行业]
  - id: company
    name: 公司动态
    description: A specific company's results, guidance, filings, or decisions.
    aliases: [corporate, 公司]
  - id: other
    name: 其他情报
    description: Useful intelligence that does not fit the categories above.

event_types:
  - id: monetary_policy
    name: 货币政策
    description: Interest-rate, liquidity, or central-bank balance-sheet action.
    aliases: [monetary policy, 央行决议]
  - id: fiscal_policy
    name: 财政政策
    description: Taxation, spending, or government-budget action.
    aliases: [fiscal policy, 财政预算]
  - id: regulation
    name: 监管事件
    description: Rulemaking, enforcement, approval, or legal action.
    aliases: [rulemaking, enforcement, 监管执法]
  - id: earnings
    name: 业绩与指引
    description: Reported results, guidance, or an earnings event.
    aliases: [earnings, guidance, 财报]
  - id: corporate_action
    name: 公司资本行动
    description: Merger, acquisition, divestiture, listing, or capital action.
    aliases: [M&A, 并购, 上市]
  - id: data_release
    name: 数据发布
    description: A scheduled or unscheduled economic or market data release.
    aliases: [economic release, 数据公布]

topics:
  - id: interest_rates
    name: 利率
    description: Policy rates, yields, or rate expectations.
    aliases: [interest rates, yields, 利率预期]
  - id: inflation
    name: 通胀
    description: Consumer, producer, or asset price levels and expectations.
    aliases: [inflation, CPI, PPI, 物价]
  - id: liquidity
    name: 流动性
    description: Money supply, funding conditions, or balance-sheet capacity.
    aliases: [liquidity, funding, 融资条件]
  - id: employment
    name: 就业
    description: Labor-market conditions and payroll data.
    aliases: [employment, payrolls, 劳动力市场]
  - id: growth
    name: 经济增长
    description: Output, activity, demand, or recession risk.
    aliases: [GDP, growth, recession, 需求]
  - id: energy
    name: 能源
    description: Energy prices, supply, or policy.
    aliases: [energy, oil, gas, 能源价格]
  - id: trade
    name: 国际贸易
    description: Tariffs, trade agreements, or cross-border flows, including export controls.
    aliases: [tariffs, exports, 关税, 出口管制]
  - id: geopolitics
    name: 地缘政治
    description: Political or security events with market relevance.
    aliases: [geopolitics, sanctions, 地缘风险]
  - id: market_sentiment
    name: 市场情绪
    description: Positioning, flows, volatility, or reported market mood.
    aliases: [positioning, volatility, 资金流]
  - id: credit
    name: 信用
    description: Credit conditions, spreads, or default risk.
    aliases: [credit spreads, default, 信用利差]

industries:
  - id: banking
    name: 银行业
    description: Banks, deposit-taking, lending, and banking-system conditions; exclude general rate news without a banking connection.
    aliases: [banks, banking, 银行, 信贷业务]
  - id: real_estate
    name: 房地产
    description: Residential and commercial property, development, real-estate services and REITs.
    aliases: [real estate, property, REITs, 房地产]
  - id: semiconductors
    name: 半导体
    description: Chip design, fabrication, packaging, equipment and semiconductor demand; exclude unrelated uses of chips.
    aliases: [semiconductor, chips, integrated circuits, 芯片, 集成电路]
  - id: software
    name: 软件
    description: Software products, cloud applications, enterprise software and software services; hardware manufacturing alone is outside this label.
    aliases: [software, SaaS, 软件, 云应用]
  - id: hardware
    name: 硬件
    description: Computers, servers, electronics and physical computing equipment; chip-specific production also belongs to semiconductors when supported.
    aliases: [hardware, servers, electronics, 服务器, 电子设备]
  - id: energy
    name: 能源产业
    description: Oil, gas, coal, renewables and energy production or services; distinguish energy producers from regulated utility operators.
    aliases: [oil and gas, renewables, 石油天然气, 可再生能源]
  - id: utilities
    name: 公用事业
    description: Electricity, gas and water utilities, grid operators and regulated utility services, including supported data-center power demand.
    aliases: [utilities, power grid, 电网, 公用事业]
  - id: industrials
    name: 工业
    description: Machinery, capital goods, aerospace, defense and industrial services; use more specific industry labels where supported.
    aliases: [capital goods, machinery, 工业设备, 航空航天]
  - id: healthcare
    name: 医疗保健
    description: Pharmaceuticals, biotechnology, medical devices, healthcare providers and health services.
    aliases: [healthcare, biotech, 医药, 医疗器械]
  - id: consumer
    name: 消费品与服务
    description: Consumer goods and services, household demand and discretionary or staple consumption; retail distribution may also apply.
    aliases: [consumer goods, staples, discretionary, 消费品]
  - id: retail
    name: 零售
    description: Physical and online retail distribution, merchants and retail sales; general consumption alone does not imply a retailer is mentioned.
    aliases: [retail, ecommerce, 零售, 电商]
  - id: transportation
    name: 交通运输
    description: Airlines, shipping, rail, trucking, logistics and transport demand or capacity.
    aliases: [transport, logistics, freight, 物流, 航运]
  - id: materials
    name: 基础材料
    description: Mining, metals, chemicals, forestry and construction materials, including their supply and pricing.
    aliases: [metals, mining, chemicals, 矿业, 化工]
  - id: telecom
    name: 电信
    description: Telecommunications networks, carriers, connectivity and communications infrastructure services.
    aliases: [telecommunications, carriers, 电信, 通信网络]
  - id: media
    name: 媒体
    description: Publishing, broadcasting, entertainment, streaming and advertising media businesses.
    aliases: [media, streaming, advertising, 传媒, 流媒体]

regions:
  - id: US
    name: 美国
    description: United States economic activity, policy, markets or explicitly supported US exposure; publication in English alone is insufficient.
    aliases: [United States, USA, 美国]
  - id: EU
    name: 欧盟
    description: European Union institutions, member-state activity and EU market exposure; not all European countries belong to the EU.
    aliases: [European Union, EU, 欧盟]
  - id: UK
    name: 英国
    description: United Kingdom economic activity, policy, markets or explicitly supported UK exposure, separately from the EU.
    aliases: [United Kingdom, Britain, 英国]
  - id: China
    name: 中国
    description: China economic activity, policy, markets or explicitly supported exposure; do not infer exposure merely from an industry association.
    aliases: [China, PRC, 中国]
  - id: Japan
    name: 日本
    description: Japan economic activity, policy, markets or explicitly supported Japanese exposure.
    aliases: [Japan, Japanese, 日本]
  - id: AsiaPacific
    name: 亚太地区
    description: Asia-Pacific regional developments or supported regional exposure; may overlap a specific country when both are supported.
    aliases: [Asia Pacific, APAC, 亚太]
  - id: EmergingMarkets
    name: 新兴市场
    description: Emerging-market economies, markets or cross-country exposure explicitly discussed; do not assign solely from a company's headquarters.
    aliases: [emerging markets, EM, 新兴市场]
  - id: Global
    name: 全球
    description: Worldwide or cross-region developments with explicitly broad relevance; not a default for documents whose geography is missing.
    aliases: [global, worldwide, 全球]
