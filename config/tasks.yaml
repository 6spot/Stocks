tasks:
  - id: saved_evidence_brief
    name: Saved Evidence Brief
    type: research
    trigger: manual
    enabled: true
    objective: Summarize the most relevant saved evidence for the requested scope.
    strategy: evidence_first
    scope:
      regions: [US]
      topics: [macro, policy, market_sentiment]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries:
            - recent US macro policy and market sentiment evidence
            - US Federal Reserve inflation policy developments
          limit_per_query: 8
          max_tokens: 30000
      - id: research
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

  - id: empty_evidence_skip
    name: Empty Evidence Condition Example
    type: research
    trigger: manual
    enabled: true
    objective: Demonstrate that an unmet step condition produces SKIPPED.
    scope:
      topics: [condition_example]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries: [deliberately unmatched manual condition example]
          limit_per_query: 1
          source_ids: [__example_missing_saved_source__]
      - id: research
        when:
          step: evidence
          op: nonempty
          field: output.items
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

  - id: unavailable_evidence_failure
    name: Explicit Evidence Failure Example
    type: research
    trigger: manual
    enabled: true
    objective: Demonstrate a persisted failure when the Agent has no evidence.
    scope:
      topics: [failure_example]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries: [deliberately unavailable evidence failure example]
          limit_per_query: 1
          source_ids: [__example_missing_saved_source__]
      - id: research
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

agents:
  - id: research_writer
    role: Research writer
    prompt: >-
      Analyze only the supplied saved evidence. Distinguish facts from
      source opinions and model inference. Mention coverage gaps, and return
      concise structured findings with the exact evidence references used by
      each finding.
    model_ref: research
    tools: []
    input_schema:
      type: object
      additionalProperties: false
      required: [run_id, objective, strategy, scope, as_of, evidence_package_id, evidence, coverage, truncated]
      properties:
        run_id:
          type: string
        objective:
          type: string
        strategy:
          anyOf:
            - type: string
            - type: "null"
        scope:
          type: object
          additionalProperties: true
        as_of:
          type: string
        evidence_package_id:
          type: string
        evidence:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        coverage:
          type: object
          additionalProperties: true
        truncated:
          type: boolean
    output_schema:
      title: research_writer_output
      type: object
      additionalProperties: false
      required: [summary, findings, open_questions, evidence_refs]
      properties:
        summary:
          type: string
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, statement, rationale, uncertainty, evidence_refs]
            properties:
              kind:
                type: string
                enum: [fact, source_opinion, model_inference]
              statement:
                type: string
              rationale:
                type: string
              uncertainty:
                type: string
              evidence_refs:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [chunk_id, document_id]
                  properties:
                    chunk_id:
                      type: string
                    document_id:
                      type: string
        open_questions:
          type: array
          items:
            type: string
        evidence_refs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [chunk_id, document_id]
            properties:
              chunk_id:
                type: string
              document_id:
                type: string
