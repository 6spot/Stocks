tasks:
  # Owner-facing manual collection: one Run collects every enabled Source in
  # config/sources.yaml through the existing collect_source service. Trigger it
  # from the Web Tasks page or `stocks.execution trigger`; no model routes are
  # resolved for a collection Run.
  - id: collect_enabled_sources
    name: 采集已启用来源
    type: collection
    trigger: manual
    enabled: true
    sources: [sec_press_releases, fed_press_releases, cnbc_markets, fred_cpiaucsl]
    steps:
      - id: collect
        collect_sources:
          kind: collect_sources

  - id: fed_policy_brief
    name: 美联储政策与宏观简报
    type: research
    trigger: manual
    enabled: true
    objective: >-
      Summarize recent US monetary policy, financial regulation and market
      sentiment from the saved Federal Reserve and SEC materials. State each
      finding's evidence, keep published values side by side, and name what
      the saved material does not cover instead of inferring it.
    strategy: evidence_first
    scope:
      regions: [US]
      topics: [macro, policy, market_sentiment]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries:
            - Federal Reserve monetary policy decisions and statements
            - Federal Reserve inflation and interest rate outlook
            - US financial regulation and market structure developments
          limit_per_query: 8
          max_tokens: 30000
      - id: research
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

  - id: nvidia_research
    name: NVIDIA 公司与行业背景研究（手动示例）
    type: research
    trigger: manual
    enabled: true
    objective: >-
      Research NVIDIA (NVDA) using saved evidence. Separate explicit company
      statements from semiconductor demand, export controls and data-center
      infrastructure background. Query roles express retrieval intent only:
      verify the actual source before calling anything a direct company mention.
      Do not infer NVDA from a company name or from industry relevance. Cite
      saved evidence for every finding and report missing company coverage.
    strategy: evidence_first
    # Scope describes research intent; it is not an exact taxonomy-label filter.
    scope:
      companies: [NVIDIA]
      symbols: [NVDA]
      industries: [semiconductors, hardware]
      topics: [growth, trade, geopolitics]
      regions: [US, China, Global]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries:
            # Existing string-query schema: company tokens make the first query
            # direct; the others receive background retrieval roles.
            - NVIDIA NVDA earnings revenue guidance data-center products company statements
            - semiconductor chips AI accelerator demand supply advanced packaging industry outlook
            - semiconductor export controls tariffs China trade policy data-center infrastructure
          limit_per_query: 8
          max_tokens: 30000
      - id: research
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

  # Real market-intelligence brief (Owner caliber 2026-10-27): an
  # intelligence-update report over macro, policy and market-sentiment material.
  # The scope deliberately carries no companies/symbols, so every query gets a
  # direct retrieval role — there is no separately nameable subject. Structured
  # macro Facts (e.g. fred_cpiaucsl) enter through the incremental change path,
  # not through semantic queries. No market-quote Source is configured yet: the
  # objective makes the report state that gap instead of inventing price moves.
  - id: market_intelligence_brief
    name: 市场情报简报
    type: research
    trigger: manual
    enabled: true
    objective: >-
      Produce a US market-intelligence update from the saved evidence: what
      changed in monetary policy, financial regulation, market structure and
      market sentiment in this run's window, each finding anchored to saved
      evidence. Separate material that is new in this window from historical
      background already in the repository, and describe sources' opinions as
      their own. Structured macro indicator Facts carry their observation
      period and availability time; never present an observation period as the
      research time. No market-quote source is configured: when the evidence
      contains no price or index data, say the market move is not covered by
      saved evidence instead of inventing levels, moves or causes. If nothing
      new was collected, write an honest update that says so.
    strategy: evidence_first
    scope:
      regions: [US]
      topics: [macro, policy, market_sentiment]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries:
            - Federal Reserve monetary policy decisions FOMC statements interest rates inflation outlook
            - US financial regulation SEC market structure enforcement market sentiment
            - US macroeconomic indicators CPI inflation employment market conditions
          limit_per_query: 8
          max_tokens: 30000
      - id: research
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

  # Real company research (Owner caliber 2026-10-27): SpaceX (Space
  # Exploration Technologies Corp, Nasdaq SPCX, CIK 0001181412 — source
  # identity owned by the sources task, not duplicated here). The first query
  # names the company and ticker explicitly; the others retrieve launch-
  # industry, policy and space-economy background without naming it. The
  # selector marks a query direct only when the scope's company/symbol tokens
  # appear in it: an aerospace hit alone is background, never proof the
  # company is mentioned. Filings and market-quote sources are not configured
  # yet, so missing company coverage and missing quotes are reported as gaps.
  - id: spacex_company_research
    name: SpaceX 公司研究
    type: research
    trigger: manual
    enabled: true
    objective: >-
      Research SpaceX (Space Exploration Technologies Corp) from the saved
      evidence. Company findings require the material to explicitly name the
      company or its ticker SPCX; aerospace, launch-industry or space-economy
      material is background even when it is about the company's market, and
      must not be presented as a statement about SpaceX. Keep quoted numbers
      with their unit, observation period and availability time, and never
      present an observation period as the research time. No SEC filings or
      market-quote source is configured for this company yet: report missing
      filings, quotes and company events as coverage gaps instead of inventing
      them, and describe which parts of the picture the saved evidence cannot
      answer.
    strategy: evidence_first
    # Scope describes research intent; it is not an exact taxonomy-label filter.
    scope:
      companies: [SpaceX]
      symbols: [SPCX]
      industries: [aerospace, space]
      topics: [launch_industry, policy, market_structure]
      regions: [US]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries:
            # Explicit company tokens make the first query direct; the others
            # receive background retrieval roles.
            - SpaceX SPCX company announcements launch vehicles Starship commercial contracts
            - commercial space launch industry competition demand satellites market outlook
            - space policy regulation launch licensing national security space programs
          limit_per_query: 8
          max_tokens: 30000
      - id: research
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

  - id: saved_evidence_brief
    name: Saved Evidence Brief
    type: research
    trigger: manual
    enabled: true
    objective: Summarize the most relevant saved evidence for the requested scope.
    strategy: evidence_first
    scope:
      regions: [US]
      topics: [macro, policy, market_sentiment]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries:
            - recent US macro policy and market sentiment evidence
            - US Federal Reserve inflation policy developments
          limit_per_query: 8
          max_tokens: 30000
      - id: research
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

  - id: empty_evidence_skip
    name: Empty Evidence Condition Example
    type: research
    trigger: manual
    enabled: true
    objective: Demonstrate that an unmet step condition produces SKIPPED.
    scope:
      topics: [condition_example]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries: [deliberately unmatched manual condition example]
          limit_per_query: 1
          source_ids: [__example_missing_saved_source__]
      - id: research
        when:
          step: evidence
          op: nonempty
          field: output.items
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

  - id: empty_evidence_report
    name: Empty Evidence Report Example
    type: research
    trigger: manual
    enabled: true
    objective: >-
      Demonstrate that a Run with no citable evidence still succeeds and
      reports its coverage gaps instead of inventing findings.
    scope:
      topics: [empty_evidence_example]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries: [deliberately unmatched empty evidence example]
          limit_per_query: 1
          source_ids: [__example_missing_saved_source__]
      - id: research
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

  # Enable this after replacing the placeholder contact email in
  # config/sources.yaml and reviewing the request bounds. A disabled Task is
  # never scheduled, and its persisted schedule row is removed.
  - id: scheduled_collection
    name: Scheduled SEC Press Release Collection (disabled example)
    type: collection
    trigger: {kind: schedule, every: 15m}
    enabled: false
    sources: [sec_press_releases]
    steps:
      - id: collect
        collect_sources:
          kind: collect_sources

  - id: scheduled_market_brief
    name: Scheduled Market Brief (disabled example)
    type: research
    trigger: {kind: schedule, cron: "0 8,20 * * *", timezone: America/New_York}
    enabled: false
    objective: Summarize recent evidence for the configured market scope.
    scope:
      regions: [US]
      topics: [macro, policy, market_sentiment]
    steps:
      - id: evidence
        select_evidence:
          kind: select_evidence
          queries: [recent US macro policy and market sentiment evidence]
          limit_per_query: 8
          max_tokens: 30000
      - id: research
        research_agent:
          kind: research_agent
          agent: research_writer
          input: evidence

agents:
  - id: research_writer
    role: Research writer
    prompt: >-
      Analyze only the supplied saved evidence. Distinguish facts from
      source opinions and model inference. Return a complete, independently
      readable Simplified Chinese research article with a specific title,
      a summary, and sections organized by meaningful themes rather than by
      document or a list of findings. Explain the important reasoning and
      material uncertainty in the section bodies so the article stands on its
      own. Attribute source opinions, make model inference conditional, and
      never add unsupported content. Use Markdown prose in section bodies;
      never expose raw internal finding, document or chunk IDs in the prose.
      Supply stable unique IDs and concise descriptive titles for the structured
      findings; each section lists its supporting finding_ids without duplicates
      and every finding must be used by at least one section. Each finding must cite exact supplied
      evidence references. The article title must describe the research topic,
      not use a generic Finding label. If evidence is insufficient, write an
      honest article explaining the limits with empty findings and empty section
      finding_ids rather than inventing conclusions. Count independent originals,
      not documents: evidence listed
      in one coverage.origin_groups entry is a single source, so more copies of
      it never make a finding more certain, and material whose origin is unknown
      stays unknown. When coverage.metric_comparisons lists same-metric values,
      state each published value with its unit and observation period side by
      side, never an average, and never call a conflict or an unconfirmed value
      verified. Report important counter-evidence and unresolved relationships
      as they are.
      Write every user-visible text field — article title, summary, section
      headings and bodies, finding titles, statements, rationales, uncertainties,
      open questions and coverage notes — in
      Simplified Chinese (简体中文). Keep source-anchored terms verbatim in the
      original language when precision requires it (institution names, rule or
      filing identifiers, quoted text), and on first mention add the original
      term in parentheses, e.g. 美国证券交易委员会（SEC）. Numeric values, units and
      ISO timestamps stay in their original form.
    model_ref: research
    tools: [tavily_search]
    input_schema:
      type: object
      additionalProperties: false
      required: [run_id, objective, strategy, scope, as_of, evidence_package_id, evidence, coverage, truncated]
      properties:
        run_id:
          type: string
        objective:
          type: string
        strategy:
          anyOf:
            - type: string
            - type: "null"
        scope:
          type: object
          additionalProperties: true
        as_of:
          type: string
        evidence_package_id:
          type: string
        evidence:
          # V2-01: a Run may legitimately have no citable evidence and report
          # the coverage gap instead; every finding still has to cite evidence.
          type: array
          items:
            type: object
            additionalProperties: true
        coverage:
          type: object
          additionalProperties: true
        truncated:
          type: boolean
    output_schema:
      title: research_writer_output
      type: object
      additionalProperties: false
      required: [title, summary, sections, findings, open_questions, evidence_refs]
      properties:
        title:
          type: string
        summary:
          type: string
        sections:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [heading, body, finding_ids]
            properties:
              heading:
                type: string
              body:
                type: string
              finding_ids:
                type: array
                items:
                  type: string
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, title, kind, statement, rationale, uncertainty, evidence_refs]
            properties:
              id:
                type: string
              title:
                type: string
              kind:
                type: string
                enum: [fact, source_opinion, model_inference]
              statement:
                type: string
              rationale:
                type: string
              uncertainty:
                type: string
              evidence_refs:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [chunk_id, document_id]
                  properties:
                    chunk_id:
                      type: string
                    document_id:
                      type: string
        open_questions:
          type: array
          items:
            type: string
        evidence_refs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [chunk_id, document_id]
            properties:
              chunk_id:
                type: string
              document_id:
                type: string
