sources:
  - source_id: sec_press_releases
    name: SEC Press Releases
    connector: rss
    enabled: true
    publisher: U.S. Securities and Exchange Commission
    trust_tier: T1
    feed_url: https://www.sec.gov/news/pressreleases.rss
    expected_freshness: 7d
    timeout_seconds: 30
    max_response_bytes: 5000000
    max_redirects: 3
    max_items: 20
    user_agent: StocksIntelligence/0.1 (6spot07@gmail.com)

  # Public macro policy releases. The feed carries the full statement, so a
  # research Run can cite the original Fed page like any other Source. Replace
  # the contact email before the first real collection run.
  - source_id: fed_press_releases
    name: Federal Reserve Press Releases
    connector: rss
    enabled: true
    publisher: Board of Governors of the Federal Reserve System
    trust_tier: T1
    feed_url: https://www.federalreserve.gov/feeds/press_all.xml
    # The Fed publishes press releases irregularly but almost weekly; a week
    # without any release is unusual enough to surface on the console.
    expected_freshness: 7d
    timeout_seconds: 30
    max_response_bytes: 5000000
    max_redirects: 3
    max_items: 20
    user_agent: StocksIntelligence/0.1 (6spot07@gmail.com)

  # External web search results retrieved through a remote MCP Tool. The Tool
  # registers retrieved originals under this Source so they keep a provenance
  # entry like any collected document; the search provider is not the publisher
  # of the retrieved pages. Trust stays T3: a search hit is a lead, not a
  # verified statement, and each result URL is cited as its own original.
  # The mapper is an inert identity declaration: this Source never runs through
  # the collection loop (enabled stays false), so nothing is fetched or mapped.
  - source_id: tavily_web
    name: Tavily Web Search Results
    connector: http_api
    enabled: false
    publisher: Tavily
    trust_tier: T3
    api_url: https://mcp.tavily.com/mcp/
    timeout_seconds: 60
    max_response_bytes: 1000000
    max_redirects: 0
    max_items: 5
    user_agent: StocksIntelligence/0.1 (6spot07@gmail.com)
    mapper:
      id: tavily-web-identity
      fields:
        - kind: text
          pointer: /query
          fact_type: search_identity
          metric_id: search_query

  # SEC EDGAR submissions API (disabled example). The endpoint needs no API key
  # but SEC requires a real contact address in the User-Agent and accepts only
  # modest request rates, so the Owner replaces CIK/contact/query scope and
  # confirms the access policy before enabling it. The mapper reads the most
  # recent filing; widen the pointers only together with the request scope.
  - source_id: sec_edgar_submissions
    name: SEC EDGAR Submissions (disabled example)
    connector: http_api
    enabled: false
    publisher: U.S. Securities and Exchange Commission
    trust_tier: T1
    api_url: https://data.sec.gov/submissions/CIK0000320193.json
    timeout_seconds: 30
    max_response_bytes: 5000000
    max_redirects: 3
    max_items: 10
    user_agent: StocksIntelligence/0.1 (6spot07@gmail.com)
    mapper:
      id: sec-edgar-submissions
      fields:
        - kind: text
          pointer: /name
          fact_type: issuer_identity
          metric_id: registrant_name
        - kind: text
          pointer: /filings/recent/form/0
          fact_type: filing_metadata
          metric_id: latest_filing_form
        - kind: text
          pointer: /filings/recent/filingDate/0
          fact_type: filing_metadata
          metric_id: latest_filing_date
        - kind: text
          pointer: /filings/recent/accessionNumber/0
          fact_type: filing_metadata
          metric_id: latest_accession_number

  # Structured HTTP API example (disabled). An `http_api` source stores the raw
  # response as a Document version and maps it to Facts through `mapper`; it never
  # configures `feed_url`. A numeric field must declare its unit — a value whose
  # unit is unknown is not stored as if it were comparable. Enable after replacing
  # the placeholder URL and contact email, and confirm the API's terms.
  - source_id: bls_cpi_example
    name: BLS CPI (disabled example)
    connector: http_api
    enabled: false
    publisher: U.S. Bureau of Labor Statistics
    trust_tier: T1
    api_url: https://api.example.gov/v1/timeseries/observations
    query:
      series: CPIAUCSL
    timeout_seconds: 30
    max_response_bytes: 2000000
    max_redirects: 3
    max_items: 10
    user_agent: StocksIntelligence/0.1 (6spot07@gmail.com)
    mapper:
      id: cpi-series
      fields:
        - kind: numeric
          pointer: /series/observations/0/value
          fact_type: macro_indicator
          metric_id: cpi_yoy
          unit: percent
          period_start_pointer: /series/observations/0/period
          available_at_pointer: /released_at
        - kind: text
          pointer: /series/id
          fact_type: series_identity
          metric_id: series_id

  # FRED macro series (2026-10-27 verified from the test server through the
  # standard collection entry): the monthly CPI index. The API key is a free
  # registration value provided through FRED_API_KEY; the YAML keeps the
  # ${FRED_API_KEY} placeholder and the registered Document records the endpoint
  # without the query string. The mapper reads only the latest observation; the
  # stored snapshot keeps the full bounded response (limit=13) for later widening.
  - source_id: fred_cpiaucsl
    name: FRED CPI (All Urban Consumers, seasonally adjusted index)
    connector: http_api
    enabled: true
    publisher: Federal Reserve Bank of St. Louis
    trust_tier: T1
    api_url: https://api.stlouisfed.org/fred/series/observations
    query:
      series_id: CPIAUCSL
      file_type: json
      sort_order: desc
      limit: "13"
      api_key: ${FRED_API_KEY}
    expected_freshness: 30d
    timeout_seconds: 30
    max_response_bytes: 2000000
    max_redirects: 3
    max_items: 1
    user_agent: StocksIntelligence/0.1 (6spot07@gmail.com)
    mapper:
      id: fred-observations
      fields:
        - kind: numeric
          pointer: /observations/0/value
          fact_type: macro_indicator
          metric_id: cpi_index_sa
          unit: index_1982_84_100
          period_start_pointer: /observations/0/date
          attributes:
            frequency: monthly
            seasonal_adjustment: seasonally_adjusted

  # CNBC Markets RSS (2026-10-27 verified end to end from the test server). The
  # legacy search.cnbc.com endpoint returns an empty body; this feed URL serves
  # the same markets wire with full item entries. Trust T2: a commercial news
  # wire, cited as its own original like any collected article.
  - source_id: cnbc_markets
    name: CNBC Markets
    connector: rss
    enabled: true
    publisher: CNBC
    trust_tier: T2
    feed_url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    expected_freshness: 1d
    timeout_seconds: 30
    max_response_bytes: 5000000
    max_redirects: 3
    max_items: 10
    user_agent: StocksIntelligence/0.1 (6spot07@gmail.com)

  # Reddit r/stocks RSS. The test server cannot reach Reddit directly: plain DNS
  # returns poisoned answers and the container network blocks the target, while
  # the configured host proxy can fetch it. The proxy is optional per source and
  # never changes direct SEC/Fed/CNBC/FRED collection. If COLLECTION_PROXY_URL is
  # unset this source fails alone with SOURCE_PROXY_UNAVAILABLE. Disabled by
  # default because Reddit returns 403 for article HTML: enabling it stores the
  # feed title and post text as `partial`, not a full discussion page.
  - source_id: reddit_stocks
    name: Reddit r/stocks
    connector: rss
    enabled: false
    publisher: Reddit
    trust_tier: T3
    feed_url: https://www.reddit.com/r/stocks/.rss
    proxy_url: ${COLLECTION_PROXY_URL}
    expected_freshness: 1h
    timeout_seconds: 30
    max_response_bytes: 2000000
    max_redirects: 3
    max_items: 20
    user_agent: StocksIntelligence/0.1 (6spot07@gmail.com)
