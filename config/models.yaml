# Native Jev decisions and OpenAI-compatible generation/embedding have separate
# providers, credentials and model names. Missing classification credentials are
# resolved only when the classify stage is claimed.
providers:
  typesafe:
    protocol: typesafe
    base_url: ${CLASSIFICATION_API_BASE_URL}
    api_key: ${CLASSIFICATION_API_KEY}
    capabilities: [decision]
    timeout_seconds: 30
  chat:
    protocol: openai_compatible
    base_url: ${MODEL_API_BASE_URL}
    api_key: ${MODEL_API_KEY}
    capabilities: [chat, text, structured_output]
    timeout_seconds: 60
  embedder:
    protocol: openai_compatible
    base_url: ${EMBEDDING_API_BASE_URL}
    api_key: ${EMBEDDING_API_KEY}
    timeout_seconds: 60
models:
  classification:
    provider: typesafe
    name: ${CLASSIFICATION_MODEL_NAME}
    capabilities: [decision]
  research:
    provider: chat
    name: ${MODEL_NAME}
    capabilities: [chat, text, structured_output]
  embedding:
    provider: embedder
    name: ${EMBEDDING_MODEL_NAME}
    dimensions: 1024
embedding:
  models: [embedding]
agents:
  research:
    routing:
      primary: research
      fallbacks: []
      required_capabilities: [chat, text, structured_output]
      # The research call returns the whole analysis in one structured response:
      # summary, several findings with citations, open questions and gaps. That is
      # much larger than one classification or one extraction, and reasoning
      # models spend part of the budget thinking. Measured on the live deployment,
      # 60s timed out twice at exactly the limit while classification (30s) and
      # fact extraction (60s) succeeded on the same model. A later measurement on
      # the same deployment with a larger evidence package (49-122 selected
      # chunks) hit 300s repeatedly: successful research calls took 89s and 225s
      # and one attempt per Run timed out at the old limit, so 300s was not a
      # usable capacity for the configured evidence budget. This is a capacity
      # value, not a relaxed safety bound: the limit stays hard, and the loader
      # still rejects anything above 600s.
      timeout_seconds: 600
      retries: 1
      retry_backoff_seconds: 0
  # Jev uses native /systemone choice/noul questions derived from the taxonomy.
  # This threshold converts noul truth probabilities into labels/should_extract.
  classification:
    protocol: typesafe
    noul_threshold: 0.5
    routing:
      primary: classification
      fallbacks: []
      required_capabilities: [decision]
      timeout_seconds: 30
      retries: 1
      retry_backoff_seconds: 0
  # Jev cannot generate unknown company/ticker text. This is a required second
  # role, not a fallback when Jev fails. It reads the same bounded excerpt and
  # returns only explicit entities with verbatim source evidence.
  classification_entities:
    protocol: openai_compatible
    routing:
      primary: research
      fallbacks: []
      required_capabilities: [chat, structured_output]
      timeout_seconds: 60
      retries: 1
      retry_backoff_seconds: 0
  # Generation Model for on-demand Fact extraction. Only Documents whose
  # classification says `should_extract: true` reach it; structured API responses
  # are mapped by a Source Mapper and never call a model.
  fact_extraction:
    protocol: openai_compatible
    routing:
      primary: research
      fallbacks: []
      required_capabilities: [chat, structured_output]
      timeout_seconds: 60
      retries: 1
      retry_backoff_seconds: 0
