# Chat and embedding may come from different vendors: each model names its own
# provider, so a chat-only API and an embedding API can be configured side by
# side. Every provider still speaks the OpenAI-compatible protocol.
providers:
  chat:
    protocol: openai_compatible
    base_url: http://host.docker.internal:3425/v1
    api_key: magpie-tunnel
    capabilities: [chat, text, structured_output]
    timeout_seconds: 60
  embedder:
    protocol: openai_compatible
    base_url: ${EMBEDDING_API_BASE_URL}
    api_key: ${EMBEDDING_API_KEY}
    timeout_seconds: 60
models:
  fast:
    provider: chat
    name: workbuddy-ai/deepseek-v4.1-flash
    fallbacks:
      - workbuddy/deepseek-v4.1-flash
    capabilities: [chat, text, structured_output]
  research:
    provider: chat
    name: workbuddy-ai/deepseek-v4.1-flash
    fallbacks:
      - workbuddy/deepseek-v4.1-flash
    capabilities: [chat, text, structured_output]
  embedding:
    provider: embedder
    name: ${EMBEDDING_MODEL_NAME}
    dimensions: 1024
embedding:
  models: [embedding]
agents:
  research:
    routing:
      primary: research
      fallbacks: []
      required_capabilities: [chat, text, structured_output]
      # The research call returns the whole analysis in one structured response:
      # summary, several findings with citations, open questions and gaps. That is
      # much larger than one classification or one extraction, and reasoning
      # models spend part of the budget thinking. Measured on the live deployment,
      # 60s timed out twice at exactly the limit while classification (30s) and
      # fact extraction (60s) succeeded on the same model. This is a capacity
      # value, not a relaxed safety bound: the limit stays hard, and the loader
      # still rejects anything above 600s.
      timeout_seconds: 300
      retries: 1
      retry_backoff_seconds: 0
  # Decision Model: a capability category, not a vendor. Point `primary` (and
  # optional `fallbacks`) at a cheap model that can answer the bounded
  # classification schema; `protocol` names the adapter, and this deployment only
  # implements `openai_compatible`. Classification schema and vocabulary are owned
  # by Stocks in config/taxonomy.yaml.
  classification:
    protocol: openai_compatible
    routing:
      primary: fast
      fallbacks: []
      required_capabilities: [chat, structured_output]
      timeout_seconds: 30
      retries: 1
      retry_backoff_seconds: 0
  # Generation Model for on-demand Fact extraction. Only Documents whose
  # classification says `should_extract: true` reach it; structured API responses
  # are mapped by a Source Mapper and never call a model.
  fact_extraction:
    protocol: openai_compatible
    routing:
      primary: research
      fallbacks: []
      required_capabilities: [chat, structured_output]
      timeout_seconds: 60
      retries: 1
      retry_backoff_seconds: 0
